name: ci

# fusion#2 CI retrofit checklist (issue #12):
# - concurrency cancel grouped by ref
# - dependency cache keyed on lockfile hash (setup-node npm cache)
# - paths-ignore so docs-only changes skip test jobs
# - sharding / tiered gate: suite runs < 1 min on CI-scale, single fast job
#   IS both the PR gate and the full suite; no nightly tier needed at this size

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "ci/validate_docs.py"
      - ".github/workflows/docs.yml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend deps
        run: npm ci
        working-directory: backend
      - name: Typecheck
        run: npm run typecheck
        working-directory: backend
      - name: Structural tests
        run: node --import tsx --test
        working-directory: backend

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps
        run: npm ci
        working-directory: frontend
      - name: Build static site
        run: npm run generate
        working-directory: frontend
