appId: com.huobao.drama
productName: HuobaoDrama
directories:
  output: release
  buildResources: build
# 主进程产物 + 后端 bundle + 清单（进入 asar）。
# backend.mjs 必须在 asar 内：其 externals（sharp/better-sqlite3）经 createRequire
# 向上解析到 app.asar/node_modules（.node 由 Electron 自动重定向到 app.asar.unpacked）
files:
  - dist/**
  - build/backend.mjs
  - package.json
# 原生模块不能留在 asar（.node 需真实文件路径被 dlopen）
asarUnpack:
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/better-sqlite3/**"
extraResources:
  - { from: resources/frontend, to: frontend }
  - { from: resources/workspace-template, to: workspace-template }
  - { from: resources/bin, to: bin }
npmRebuild: true
mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  category: public.app-category.productivity
  # 先出未签名包：正式分发需 Apple Developer 签名 + notarize（配置位已留）
  identity: null
  icon: assets/icon.icns
win:
  target:
    - target: nsis
      arch: [x64]
  # signExecutable:false 仅跳过签名（未签名分发 SmartScreen 会提示），
  # 图标与版本信息仍会写入 exe；正式分发需代码签名证书
  signExecutable: false
  icon: assets/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  shortcutName: HuobaoDrama
